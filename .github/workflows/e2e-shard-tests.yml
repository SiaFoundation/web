name: Run sharded e2e tests

permissions:
  contents: read
  actions: write # Needed to upload blob reports as artifacts.

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      shardIndex:
        required: true
        type: number
      shardTotal:
        required: true
        type: number

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all commits
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      # Full setup required since building the JS SDK requires Go.
      - name: Setup environment
        uses: ./.github/actions/setup-all
        with:
          bun_version: 1.4.4
          go_version: 1.24.3
      - name: Only run if ${{ inputs.project }} is affected
        id: check
        run: |
          AFFECTED=$(nx show projects --affected --projects=${{ inputs.project }})
          if [[ -z "$AFFECTED" ]]; then
            echo "${{ inputs.project }} is unaffected. Exiting."
            echo "continue=false" >> $GITHUB_OUTPUT
          else
            echo "${{ inputs.project }} is affected. Continuing."
            echo "continue=true" >> $GITHUB_OUTPUT
          fi
      # indexd nodes run on embedded postgres, which downloads its binaries
      # from Maven Central on first use.
      - name: Get embedded postgres version
        if: ${{ steps.check.outputs.continue == 'true' && inputs.project == 'indexd-e2e' }}
        id: postgres
        shell: bash
        run: echo "version=$(grep -m1 fergusstrange/embedded-postgres internal/cluster/go.mod | awk '{print $2}')" >> $GITHUB_OUTPUT
      - name: Cache embedded postgres binaries
        if: ${{ steps.check.outputs.continue == 'true' && inputs.project == 'indexd-e2e' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ steps.postgres.outputs.version }}
      - name: Install Playwright dependencies
        if: ${{ steps.check.outputs.continue == 'true' }}
        shell: bash
        run: bunx playwright install-deps
      - name: Test e2e for ${{ inputs.project }}
        if: ${{ steps.check.outputs.continue == 'true' }}
        shell: bash
        run: nx run ${{ inputs.project }}:e2e --shard=${{ inputs.shardIndex }}/${{ inputs.shardTotal }}
      - name: Upload blob report to GitHub Actions Artifacts
        if: ${{ steps.check.outputs.continue == 'true' && !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.project }}-blob-report-${{ inputs.shardIndex }}
          path: blob-report
          retention-days: 1
