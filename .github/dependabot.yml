# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'gomod'
    directories:
      - '/hostd'
      - '/renterd'
      - '/indexd'
      - '/walletd'
      - '/sdk'
      - '/internal/cluster'
      - '/internal/nextjs'
    schedule:
      interval: 'daily'
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    # A dependency joins the first group it matches, so nx is listed first.
    groups:
      # A partial nx upgrade does not build: the plugins and the runner resolve
      # each other's versions.
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
          - '@nx-tools/*'
      # Majors are left out so each one arrives as its own pull request. Grouped
      # with everything else they are unreviewable and a single unbuildable
      # major blocks the whole batch.
      dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # TypeScript 7 ships no compiler API until 7.1, and nx and typescript-eslint
      # both call it while building. Revisit once all three line up.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Tailwind 4 changes several default styles across every app and breaks the
      # theme preset the design system publishes; it needs its own migration.
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
